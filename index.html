*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;font-family:Roboto,Arial,sans-serif;color:var(--txt);background:#0b1030}
body{background:var(--bg);background-attachment:fixed}
button{font-family:inherit;color:inherit;cursor:pointer}
input{font-family:inherit;color:#fff;user-select:text}
input::placeholder{color:rgba(255,255,255,.5)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* LOADER */
#loader{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
#loader .ring{width:240px;height:240px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-shadow:0 0 60px rgba(255,210,80,.55)}
#loader .ring>*{animation:spin 3s ease-in-out infinite}
@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
#loader h1{font-size:64px;letter-spacing:8px;margin:26px 0 4px;text-shadow:0 4px 8px rgba(0,0,0,.6)}
#loader .sub{letter-spacing:6px;font-weight:700;font-size:14px;text-shadow:0 2px 4px #000;text-align:center}
#loader .sub i{color:var(--gold);font-style:normal;margin:0 6px}
.bar{width:78%;max-width:420px;height:26px;border-radius:20px;border:2px solid #cfd8cf;background:rgba(10,20,40,.6);margin-top:34px;overflow:hidden}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,#d99a00,#ffe27a);transition:width .1s linear}
#pct{font-size:30px;font-weight:900;margin-top:16px;text-shadow:0 2px 6px #000}
/* LANG SCREEN */
#langscr{position:fixed;inset:0;z-index:500;background:var(--bg);display:none;flex-direction:column;justify-content:center;padding:24px}
#langscr.on{display:flex}
#langscr h3{text-align:center;font-size:17px;margin:0 0 22px;text-shadow:0 2px 6px #000}
.lbtn{display:flex;align-items:center;gap:18px;width:100%;padding:22px 24px;margin-bottom:16px;border-radius:34px;border:2px solid var(--line);background:rgba(255,255,255,.14);backdrop-filter:blur(8px);font-size:26px;font-weight:900;text-shadow:0 2px 4px #000}
.lbtn span{font-size:40px}
/* HEADER */
#hdr{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.lvl{width:44px;height:44px;border-radius:50%;background:#2c88b5;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid rgba(255,255,255,.5);flex:none}
.who{flex:1;min-width:0;text-shadow:0 1px 4px #000}
.who small{display:block;letter-spacing:2px;font-size:11px;opacity:.9}.who small b{color:#5be08a}
.who div{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:6px;background:rgba(20,50,100,.55);border:1.5px solid var(--line);border-radius:22px;padding:6px 10px;font-weight:900;font-size:15px}
.plus{width:24px;height:24px;border-radius:50%;background:var(--gold);color:#000;border:0;font-weight:900;line-height:1}
.dot{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe98a,#f2b100);display:inline-block}
#view{flex:1;overflow-y:auto;padding:6px 12px 130px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
/* NAV */
#nav{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;padding:8px 6px;border-radius:34px;background:rgba(8,12,36,.88);box-shadow:0 0 0 3px #ff7aa8, 0 0 0 5px #6ad4ff;backdrop-filter:blur(8px);z-index:10}
#nav button{flex:1;background:none;border:2px solid transparent;border-radius:24px;padding:8px 2px;font-size:10px;font-weight:800;letter-spacing:1px;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.9}
#nav button span{font-size:24px;line-height:1}
#nav button.on{background:rgba(245,194,43,.18);border-color:rgba(245,194,43,.7);color:var(--gold);box-shadow:0 0 14px rgba(245,194,43,.4)}
/* COMMON */
.card{background:var(--glass);border:1.5px solid var(--line);border-radius:26px;padding:14px;margin:10px 0;backdrop-filter:blur(6px);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.row{display:flex;align-items:center;gap:12px}
.ico{width:52px;height:52px;border-radius:16px;border:1.5px solid var(--line);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.grow{flex:1;min-width:0}
.t1{font-weight:800;font-size:18px}.t2{font-size:14px;opacity:.9}
.seg{display:flex;background:rgba(20,50,100,.45);border:1.5px solid var(--line);border-radius:24px;padding:6px;margin:10px 0;gap:4px}
.seg button{flex:1;background:none;border:2px solid transparent;border-radius:18px;padding:12px 4px;font-weight:900;font-size:15px;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:8px;text-shadow:0 1px 3px #000}
.seg button.on{border-color:#fff;background:rgba(255,255,255,.12)}
.btn{background:linear-gradient(#f7cf3d,#e0a90f);color:#2a1d00;border:0;border-radius:30px;padding:14px;font-weight:900;font-size:16px;letter-spacing:.5px;width:100%;text-shadow:none;box-shadow:0 5px 14px rgba(0,0,0,.35)}
.btn.sm{width:auto;padding:12px 20px}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;border:2px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.5}
.btn.out{background:transparent;color:#fff;border:2px solid var(--gold);box-shadow:none;border-radius:26px}
.lab{font-size:13px;letter-spacing:2.5px;font-weight:800;margin:16px 4px 8px;text-shadow:0 1px 3px #000}

try{ S = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY)) || {}); }catch(e){ S = Object.assign({}, DEFAULTS); }
if(!Array.isArray(S.owned)||!S.owned.length) S.owned=['basic'];
['tasks','orders','sends'].forEach(k=>{ if(!Array.isArray(S[k])) S[k]=[]; });
['done','pending','usedCodes'].forEach(k=>{ if(typeof S[k]!=='object'||!S[k]) S[k]={}; });
if(!SKINS.some(k=>k.id===S.skin)) S.skin='basic';

['d','c','energy','uzs','invited','musicPos'].forEach(k=>{ if(typeof S[k]!=='number'||isNaN(S[k])) S[k]=0; });
if(!S.aucs){
  S.aucs = ADMIN_AUCTIONS.map(a=>({id:a.id,title:a.title,seller:a.seller,end:Date.now()+a.hours*3600e3,cur:a.start,top:a.bidder,users:a.bidder?[a.bidder]:[],mine:0,settled:false}));
}
/* 5 belgili shaxsiy kod: Telegram ID dan barqaror hosil qilinadi */
function makeCode(){
  const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out='';
  if(TU&&TU.id){ let n=Number(TU.id)%Math.pow(32,5); for(let i=0;i<5;i++){out=ch[n%32]+out;n=Math.floor(n/32)} }
  else for(let i=0;i<5;i++) out+=ch[Math.floor(Math.random()*32)];
  return out;
}
if(!/^[A-Z0-9]{5}$/.test(S.code)) S.code=makeCode();

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

function copyText(v){
  const ok=()=>toast(t('copied'));

  function fb(){ const a=document.createElement('textarea');a.value=v;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();ok() }
}

  const k=skin();
  return `<div id="bigc"><span class="dot"></span><span id="bc">${fmt(S.c)}</span></div>
  <div id="coinwrap"><div id="coin">${coin(k,'100%')}</div><button id="shopbtn" data-act="shop">🛍️ ${t('shop')}</button></div>

  <div class="bt"><div id="eb" style="width:${S.energy/k.en*100}%"></div></div></div>`;

function bindCoin(){
  const c=$('#coin');
  c.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const k=skin();
    if(S.energy<1){toast(t('noEnergy'));return}
    S.energy-=1;S.c+=k.mult;
    c.classList.add('p');setTimeout(()=>c.classList.remove('p'),80);
    const f=document.createElement('div');f.className='fl';f.textContent='+'+k.mult;
    f.style.left=(e.clientX-12)+'px';f.style.top=(e.clientY-30)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),800);
    $('#bc').textContent=fmt(S.c);hdr();$('#et').textContent=Math.floor(S.energy)+'/'+k.en;$('#eb').style.width=S.energy/k.en*100+'%';
    if(tg&&tg.HapticFeedback)try{tg.HapticFeedback.impactOccurred('light')}catch(_){}
  });
}
setInterval(()=>{
  const k=skin();
  if(S.energy<k.en){S.energy=Math.min(k.en,S.energy+1);if(tab==='home'&&$('#et')){$('#et').textContent=Math.floor(S.energy)+'/'+k.en;$('#eb').style.width=S.energy/k.en*100+'%'}}
  save();
},1000);

function shop(){
  const body=SKINS.map((k,i)=>{
    const owned=S.owned.includes(k.id), sel=S.skin===k.id;
    const unlocked=SKINS.slice(0,i).every(x=>S.owned.includes(x.id));
    const btn=sel?`<button class="btn ghost" disabled>${t('selected')}</button>`:owned?`<button class="btn" data-act="pick" data-id="${k.id}">${t('pick')}</button>`:
      unlocked?`<button class="btn" data-act="buy" data-id="${k.id}">${t('buy')}</button>`:`<button class="btn ghost" disabled>${t('locked')}</button>`;
    return `<div class="skin ${sel?'sel':''}">${sel?`<div class="tag">${t('selTag')}</div>`:''}<div class="im"><div class="pr">💎 ${fmt(k.price)}</div>${coin(k,110)}</div>
    <h4>${esc(t('sk_'+k.id))}</h4><p>x${k.mult} ${t('tap')} · ⚡ ${fmt(k.en)} ${t('maxEn')}</p>${btn}</div>`;
  }).join('');
  modal(t('shopTitle'),`<p class="t2" style="margin-top:0">${t('shopDesc')}</p><div class="grid2">${body}</div>`);

/* ================= BARABAN ================= */
let rot=0,spinning=false;
function wheelSVG(){
  const n=WHEEL.length,R=170,cx=180,cy=180;let p='';
  for(let i=0;i<n;i++){
    const a0=(i*360/n-90)*Math.PI/180,a1=((i+1)*360/n-90)*Math.PI/180,am=(a0+a1)/2;
    const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    const tx=cx+R*.68*Math.cos(am),ty=cy+R*.68*Math.sin(am),deg=am*180/Math.PI+90;
    p+=`<path d="M${cx} ${cy}L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="${WCOL[i]}" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
    <text transform="translate(${tx} ${ty}) rotate(${deg})" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" stroke="#0003" stroke-width="1">${fmt(WHEEL[i])}💎</text>`;
  }
  return `<div style="position:relative;width:100%;max-width:360px;margin:0 auto"><div style="position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:6px;height:40px;background:linear-gradient(#ffe27a,#fff0);border-radius:4px;z-index:3"></div>
  <svg id="wheel" viewBox="0 0 360 360" style="transform:rotate(${rot}deg);width:100%;display:block;border-radius:50%;border:8px solid rgba(255,255,255,.35)">${p}</svg>
  <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;backdrop-filter:blur(4px)">Xora</div></div>`;
}
function wheelModal(){
  modal(t('wheelT'),`${wheelSVG()}<div class="row" style="justify-content:center;margin:22px 0 12px"><span class="dot"></span><span style="font-size:20px">${t('spinCost',{n:fmt(CFG.SPIN_COST)})}</span></div><button class="btn ghost" data-act="spin" style="font-size:24px;letter-spacing:3px">${t('spin')}</button>`);
}
function spin(){
  if(spinning)return;
  if(S.c<CFG.SPIN_COST){toast(t('noCoin'));return}
  S.c-=CFG.SPIN_COST;hdr();spinning=true;
  const w=WHEEL.map(v=>v===1000?1:20),tot=w.reduce((a,b)=>a+b);let r=Math.random()*tot,i=0;while(r>w[i]){r-=w[i];i++}
  const center=i*(360/WHEEL.length)+180/WHEEL.length;
  const cur=((rot%360)+360)%360;
  rot+=((360-center)-cur+360)%360+360*6;
  const wh=$('#wheel'); if(wh) wh.style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>{spinning=false;S.d+=WHEEL[i];save();hdr();toast(t('won',{n:WHEEL[i]}))},4100);
}

  },

  aview(d){aucModal(d.id)},
  bid(d){
    const a=S.aucs.find(x=>x.id===d.id),v=parseInt($('#bv').value)||0;
    if(a.end<=Date.now()){toast(t('aucEnded'));return}
    if(v<a.cur+50){toast(t('minBid',{n:fmt(a.cur+50)}));return}
    const need=v-a.mine;
    if(S.c<need){toast(t('noCoin'));return}
    S.c-=need;a.mine=v;a.cur=v;a.top=myName;if(!a.users.includes(myName))a.users.push(myName);save();hdr();aucModal(a.id);toast(t('bidOk'));
  },
  dep(){toast(t('soon'))},wd(){toast(t('soon'))},
  getcode(){openLink('https://t.me/'+CFG.BONUS_CHANNEL)},
  redeem(){
    const code=($('#bcode').value||'').trim().toUpperCase(), r=BONUS_CODES[code];
    if(!r){toast(t('badCode'));return}
    if(S.usedCodes[code]){toast(t('usedCode'));return}
    S.usedCodes[code]=Date.now();S.c+=r.c||0;S.d+=r.d||0;save();hdr();
    const parts=[];if(r.c)parts.push('+'+fmt(r.c)+' coin');if(r.d)parts.push('+'+fmt(r.d)+' 💎');
    $('#bcode').value='';toast(t('bonusOk',{n:parts.join(' ')}));
  },
  copy(d){copyText(d.v)},
  async dosend(){
    const to=($('#rc').value||'').trim().toUpperCase(), amt=parseInt($('#ra').value)||0;
    if(!/^[A-Z0-9]{5}$/.test(to)){toast(t('badRcv'));return}
    if(to===S.code){toast(t('selfSend'));return}
    if(amt<1){toast(t('badAmt'));return}
    if(amt>S.d){toast(t('noDia'));return}
    if(CFG.API){
      try{
        const r=await fetch(CFG.API.replace(/\/$/,'')+'/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:S.code,to,amount:amt,initData:(tg&&tg.initData)||''})});
        const j=await r.json();
        if(!j.ok){toast(j.error||t('netErr'));return}
      }catch(e){toast(t('netErr'));return}
    }
    S.d-=amt;
    const id=Array.from({length:10},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
    const x={id,to,amt,t:Date.now()};S.sends.unshift(x);save();hdr();render();showReceipt(x);
  },
  rcpt(d){const x=S.sends.find(y=>y.id===d.id);if(x)showReceipt(x)},
  rclose(){$('#rcpt').classList.remove('on')},
  games(){toast('🛠️ '+t('maint'))},relis(){toast(t('soon'))},
  lang(){$('#langscr').classList.add('on')},
  setlang(d){S.lang=d.v;S.langSet=true;save();$('#langscr').classList.remove('on');closeM();renderNav();fillLoader();render()},
  music(){S.music=!S.music;save();musicSync();render()},
  exch(){
    modal(t('exch'),`<p class="t2" style="margin-top:0">${t('exRate')}</p>
    <div class="lab">${t('c2dL')}</div><input class="inp" id="ea" type="number" inputmode="numeric" placeholder="${t('howMany')}"><button class="btn" style="margin:10px 0 18px" data-act="c2d">${t('c2dB')}</button>
    <div class="lab">${t('d2cL')}</div><input class="inp" id="eb2" type="number" inputmode="numeric" placeholder="${t('howMany')}"><button class="btn ghost" style="margin-top:10px" data-act="d2c">${t('d2cB')}</button>`);
  },
  c2d(){const n=parseInt($('#ea').value)||0;if(n<1||S.c<n*1000){toast(t('noCoin'));return}S.c-=n*1000;S.d+=n;save();hdr();closeM();toast('+'+n+' 💎')},
  d2c(){const n=parseInt($('#eb2').value)||0;if(n<1||S.d<n){toast(t('noDia'));return}S.d-=n;S.c+=n*1000;save();hdr();closeM();toast('+'+fmt(n*1000)+' coin')}
};
document.addEventListener('click',e=>{const x=e.target.closest('[data-act]');if(x&&A[x.dataset.act])A[x.dataset.act](x.dataset)});
document.addEventListener('input',e=>{
  if(e.target.id==='tn'){const n=parseInt(e.target.value)||0;$('#tp').textContent=fmt(n*CFG.PER_PERSON)}
});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= MUSIQA (to'xtatilganda davom etadi) ================= */
const bgm=$('#bgm');
bgm.addEventListener('loadedmetadata',()=>{ if(S.musicPos>0&&bgm.duration&&S.musicPos<bgm.duration){try{bgm.currentTime=S.musicPos}catch(e){}} });
function musicSync(){
  if(S.music){ const p=bgm.play(); if(p&&p.catch)p.catch(()=>{}); }
  else bgm.pause();            // pause() joyni saqlaydi, play() shu joydan davom ettiradi
}
// brauzer ovozni faqat birinchi bosishdan keyin ruxsat beradi
document.addEventListener('pointerdown',()=>{ if(S.music&&bgm.paused){const p=bgm.play();if(p&&p.catch)p.catch(()=>{})} },{passive:true});
setInterval(()=>{ if(!bgm.paused&&bgm.currentTime>0){S.musicPos=bgm.currentTime;save()} },2000);
document.addEventListener('visibilitychange',()=>{ if(document.hidden){bgm.pause()} else if(S.music){const p=bgm.play();if(p&&p.catch)p.catch(()=>{})} });

/* ================= YUKLANISH 0 → 100% (3 soniya) ================= */
function fillLoader(){const e=$('#lsub');if(e)e.innerHTML=`${t('ld1')}<i>◆</i>${t('ld2')}<i>◆</i>${t('ld3')}`}
(function loader(){
  fillLoader();
  $('#lcoin').innerHTML=coin(SKINS[0],176);
  const t0=performance.now(),Dm=3000;
  (function step(now){
    const p=Math.min(100,Math.floor((now-t0)/Dm*100));
    $('#lbar').style.width=p+'%';$('#pct').textContent=p+'%';
    if(p<100) requestAnimationFrame(step);
    else setTimeout(()=>{$('#loader').classList.add('hide');setTimeout(()=>$('#loader').remove(),600)},250);
  })(t0);
})();

if(!S.langSet) $('#langscr').classList.add('on');
renderNav();render();settle();musicSync();
</script>
</body>
</html>
